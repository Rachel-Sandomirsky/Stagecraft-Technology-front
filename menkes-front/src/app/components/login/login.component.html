<div class="login-container form-container">
  <button class="close-btn" (click)="goBack()">×</button>
  <h2>התחברות</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">אימייל:</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        placeholder="הכנס את כתובת האימייל שלך"
      />
      <div
        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        class="error-message"
      >
        כתובת אימייל אינה תקינה.
      </div>
    </div>

    <div class="form-group">
      <label for="password">סיסמה:</label>
      <div class="password-container">
        <input 
          id="password" 
          formControlName="password" 
          [type]="isPasswordVisible ? 'text' : 'password'" 
          placeholder="הכנס סיסמה" 
        />
        <div class="eye-icon" (click)="togglePasswordVisibility()">
          <i class="fa" [ngClass]="isPasswordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
        </div>
      </div>
      <div
        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        class="error-message"
      >
        הסיסמה חייבת להיות באורך של לפחות 8 תווים.
      </div>
      <div class="forgot-password-link">
        <a (click)="onForgotPassword()">שכחת סיסמה?</a>
      </div>
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">התחבר</button>
  </form>
  <p class="link">
    אין לך חשבון? <a routerLink="/signup">הרשמה</a>
  </p>
</div>
