<div class="container">
  <div *ngIf="step === 1" class="card">
    <h2>שכחת סיסמה</h2>
    <form [formGroup]="emailForm" (ngSubmit)="onEmailSubmit()">
      <label for="email">הכנס כתובת מייל:</label>
      <input id="email" type="email" formControlName="email" placeholder="example@email.com" />
      <small *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
        נא להכניס מייל חוקי.
      </small>
      <button type="submit" [disabled]="emailForm.invalid">אמת מייל</button>
    </form>
  </div>

  <div *ngIf="step === 2" class="card">
    <h2>אימות קוד</h2>
    <p>קוד אימות נשלח למייל שלך, אנא הקלד אותו למטה:</p>
    <form [formGroup]="codeForm" (ngSubmit)="onCodeSubmit()">
      <label for="code">הכנס קוד:</label>
      <input id="code" type="text" formControlName="code" />
      <small *ngIf="codeForm.get('code')?.invalid && codeForm.get('code')?.touched">
        נא להכניס קוד חוקי (לפחות 6 ספרות).
      </small>
      <button type="submit" [disabled]="codeForm.invalid">בדוק קוד</button>
    </form>
  </div>

  <div *ngIf="step === 3" class="card">
    <h2>איפוס סיסמה</h2>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPasswordSubmit()">
      <label for="newPassword">סיסמה חדשה:</label>
      <input id="newPassword" type="password" formControlName="newPassword" />
      <label for="confirmPassword">אימות סיסמה:</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
      <small *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
        סיסמה חייבת להיות באורך 6 תווים לפחות.
      </small>
      <small *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched">
        נא לאמת את הסיסמה.
      </small>
      <button type="submit" [disabled]="resetPasswordForm.invalid">אפס סיסמה</button>
    </form>
  </div>
</div>
