<div class="recommendations-container">
  <h2>המלצות סטודנטים</h2>
  <div class="recommendations-list">
    <div class="recommendation-card" *ngFor="let recommendation of recommendations">
      <h3>{{ recommendation.course }}</h3>
      <p class="feedback">"{{ recommendation.feedback }}"</p>
      <p class="student">- {{ recommendation.student }}</p>
    </div>
  </div>
</div>
